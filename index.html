<!doctype html>
<html lang="zh-CN" style="background-color: #080f1e; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCADA 工业组态工作台</title>
    <meta name="description" content="SCADA 工业监控系统与组态工程平台，支持实时监控、遥控置数、历史曲线与工程管理。" />
    <meta property="og:title" content="SCADA 工业组态工作台" />
    <meta property="og:description" content="SCADA 工业监控系统与组态工程平台，支持实时监控、遥控置数、历史曲线与工程管理。" />
    <style>
      html, body {
        background-color: #080f1e;
        color: #cbd5e1;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      window.addEventListener('error', function (e) {
        if (
          e &&
          e.message &&
          (e.message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
           e.message.indexOf('ResizeObserver loop limit exceeded') !== -1)
        ) {
          e.stopImmediatePropagation();
        }
      });

      // 动态根据 URL 参数立即匹配背景色，杜绝任何白屏或闪烁
      try {
        var search = window.location.search || '';
        if (search.indexOf('mode=start-menu') !== -1 ||
            search.indexOf('mode=user-menu') !== -1 ||
            search.indexOf('mode=daemon-bar') !== -1) {
          document.documentElement.style.backgroundColor = '#f2eee3';
        } else if (search.indexOf('module=graphic-editor') !== -1) {
          document.documentElement.style.backgroundColor = '#0b132b';
        } else {
          document.documentElement.style.backgroundColor = '#080f1e';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#080f1e] text-slate-200 select-none overflow-hidden m-0 p-0" style="background-color: #080f1e;">
    <div id="app">
      <!-- 极速首屏占位加载动画 (与监控主题完美融合，毫秒级即时展示，绝无白屏) -->
      <div id="scada-module-loading" style="position:fixed;inset:0;background-color:#080f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#94a3b8;z-index:999999;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div style="width:32px;height:32px;border-radius:8px;background-color:#d81e06;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;box-shadow:0 2px 10px rgba(216,30,6,0.35);">K</div>
          <span style="font-size:18px;font-weight:bold;color:#f8fafc;letter-spacing:1px;">SCADA 工业工作台</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:#0284c7;background-color:rgba(2,132,199,0.08);padding:6px 16px;border-radius:20px;border:1px solid rgba(2,132,199,0.25);">
          <svg style="width:16px;height:16px;animation:scada-spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" stroke="#334155" stroke-width="2.5"/>
            <path d="M12 2a10 10 0 0 1 10 10" stroke="#0284c7"/>
          </svg>
          <span style="font-weight:500;">正在加载工业测点与组态...</span>
        </div>
      </div>
      <style>
        @keyframes scada-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
      </style>
      <script>
        try {
          var s = window.location.search || '';
          if (s.indexOf('mode=start-menu') !== -1 || s.indexOf('mode=user-menu') !== -1 || s.indexOf('mode=daemon-bar') !== -1) {
            var loader = document.getElementById('scada-module-loading');
            if (loader) loader.style.display = 'none';
          } else if (s.indexOf('module=graphic-editor') !== -1) {
            var loader = document.getElementById('scada-module-loading');
            if (loader) loader.style.backgroundColor = '#0b132b';
          }
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
